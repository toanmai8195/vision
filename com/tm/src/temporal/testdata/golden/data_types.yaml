# Golden: com/tm/docs/data-types.md — ví dụ trực quan cho 4 loại, as-of 15/09/2026.
# A1 = 15/09 · A7 = 09/09→15/09 · A30 = 17/08→15/09. Một user duy nhất, uidx = 1.

cases:
  # §1 MUTEX — An
  - name: an_mutex
    attribute:
      id: 1001
      name: churn_an
      data_type: MUTEX
      feed_mode: EVENT
      tags: {low: 1, mid: 2, high: 3}
      supported_date_ranges: [A1, A7, A30]
    ds: 2026-09-15
    history_start: 2026-08-01
    universe: [1]
    tag_events:
      - {uidx: 1, day: 2026-09-01, add: [high]}
      - {uidx: 1, day: 2026-09-09, add: [low]}
      - {uidx: 1, day: 2026-09-12, add: [mid]}
    expected:
      ranges:
        A1: {}
        A7: {mid: [1]}
        A30: {mid: [1]}
      custom:
        - {from: 2026-09-01, to: 2026-09-10, tags: {low: [1]}}

  # §1 — thêm 13/09 REMOVE mid → A7 không thuộc tag nào (không quay lại low)
  - name: an_mutex_remove
    attribute:
      id: 1001
      name: churn_an
      data_type: MUTEX
      feed_mode: EVENT
      tags: {low: 1, mid: 2, high: 3}
      supported_date_ranges: [A7]
    ds: 2026-09-15
    history_start: 2026-08-01
    universe: [1]
    tag_events:
      - {uidx: 1, day: 2026-09-01, add: [high]}
      - {uidx: 1, day: 2026-09-09, add: [low]}
      - {uidx: 1, day: 2026-09-12, add: [mid]}
      - {uidx: 1, day: 2026-09-13, remove: [mid]}
    expected:
      ranges:
        A7: {}

  # §2 NOT_MUTEX — Bình
  - name: binh_not_mutex
    attribute:
      id: 1002
      name: product_binh
      data_type: NOT_MUTEX
      feed_mode: EVENT
      tags: {paylater: 1, insurance: 2, savings: 3}
      supported_date_ranges: [A1, A7, A30]
    ds: 2026-09-15
    history_start: 2026-08-01
    universe: [1]
    tag_events: &binh
      - {uidx: 1, day: 2026-09-03, add: [paylater]}
      - {uidx: 1, day: 2026-09-10, add: [insurance]}
      - {uidx: 1, day: 2026-09-12, remove: [paylater]}
      - {uidx: 1, day: 2026-09-14, add: [savings]}
    expected:
      ranges:
        A1: {}  # EVENT: 15/09 không có tín hiệu
        A7: {insurance: [1], savings: [1]}
        A30: {insurance: [1], savings: [1]}
      custom:
        - {from: 2026-09-01, to: 2026-09-05, tags: {paylater: [1]}}

  # §2 "Khai báo sai loại": cùng chuỗi của Bình coi là MUTEX → A7 chỉ còn savings
  - name: binh_as_mutex
    attribute:
      id: 1002
      name: product_binh
      data_type: MUTEX
      feed_mode: EVENT
      tags: {paylater: 1, insurance: 2, savings: 3}
      supported_date_ranges: [A7]
    ds: 2026-09-15
    history_start: 2026-08-01
    universe: [1]
    tag_events: *binh
    expected:
      ranges:
        A7: {savings: [1]}

  # "EVENT hay STATE": Bình nạp như STATE → mọi khoảng ngày = trạng thái hiện tại
  - name: binh_state
    attribute:
      id: 1002
      name: product_binh
      data_type: NOT_MUTEX
      feed_mode: STATE
      tags: {paylater: 1, insurance: 2, savings: 3}
      supported_date_ranges: [A1, A7, A30]
    ds: 2026-09-15
    history_start: 2026-08-01
    universe: [1]
    intervals:
      - {uidx: 1, tag: paylater, from: 2026-09-03, to: 2026-09-12}
      - {uidx: 1, tag: insurance, from: 2026-09-10}
      - {uidx: 1, tag: savings, from: 2026-09-14}
    expected:
      ranges:
        A1: {insurance: [1], savings: [1]}
        A7: {insurance: [1], savings: [1]}
        A30: {insurance: [1], savings: [1]}

  # §3 PARTIAL_VALUE — Chi
  - name: chi_partial_value
    attribute:
      id: 1003
      name: amount_chi
      data_type: PARTIAL_VALUE
      tags:
        lt_500k: {id: 1, value_range: {from: 0, to: 500000}}
        500k_2m: {id: 2, value_range: {from: 500000, to: 2000000}}
        gte_2m: {id: 3, value_range: {from: 2000000}}
      supported_date_ranges: [A1, A7, A30]
    ds: 2026-09-15
    history_start: 2026-08-01
    universe: [1, 2]
    value_events:
      - {uidx: 1, day: 2026-09-01, value: "1500000"}
      - {uidx: 1, day: 2026-09-10, value: "300000"}
      - {uidx: 1, day: 2026-09-15, value: "200000"}
      - {uidx: 1, day: 2026-09-15, value: "100000"}
    expected:
      pv_range_value:
        A1: [{uidx: 1, value: "300000"}]
        A7: [{uidx: 1, value: "600000"}]
        A30: [{uidx: 1, value: "2100000"}]
      ranges:
        A1: {lt_500k: [1]}
        A7: {500k_2m: [1]}
        A30: {gte_2m: [1]}
      custom:
        - {from: 2026-09-01, to: 2026-09-09, tags: {500k_2m: [1]}}
      conditions:
        - condition: {attr: amount_chi, dateRange: A7, valueRange: {fromValue: "1000000", fromInclusive: true}}
          result: []
        - condition: {attr: amount_chi, dateRange: A30, valueRange: {fromValue: "1000000", fromInclusive: true}}
          result: [1]
        # uidx 2 không có giao dịch → không thuộc range nào, kể cả range chứa 0
        - condition: {attr: amount_chi, tags: [lt_500k], dateRange: A1}
          result: [1]

  # §4 PARTIAL_VALUE_BY_TAG — Chi có phân loại
  - name: chi_by_tag
    attribute:
      id: 1004
      name: amount_chi_by_category
      data_type: PARTIAL_VALUE_BY_TAG
      tags: {fnb: 1, travel: 2, bill: 3}
      supported_date_ranges: [A7, A30]
    ds: 2026-09-15
    history_start: 2026-08-01
    universe: [1]
    value_events:
      - {uidx: 1, day: 2026-09-01, tag: travel, value: "1500000"}
      - {uidx: 1, day: 2026-09-10, tag: fnb, value: "300000"}
      - {uidx: 1, day: 2026-09-15, tag: fnb, value: "200000"}
      - {uidx: 1, day: 2026-09-15, tag: bill, value: "100000"}
    expected:
      conditions:
        - condition: {attr: amount_chi_by_category, tags: [fnb], dateRange: A7, valueRange: {fromValue: "500000", fromInclusive: true}}
          result: [1]
        - condition: {attr: amount_chi_by_category, tags: [bill], dateRange: A7, valueRange: {fromValue: "500000", fromInclusive: true}}
          result: []
        - condition: {attr: amount_chi_by_category, tags: [travel], dateRange: A7, valueRange: {fromValue: "1000000", fromInclusive: true}}
          result: []
        - condition: {attr: amount_chi_by_category, tags: [travel], dateRange: A30, valueRange: {fromValue: "1000000", fromInclusive: true}}
          result: [1]
        # tagOp OR: ít nhất một tag thoả; AND: mọi tag thoả; không cộng gộp giữa các tag
        - condition: {attr: amount_chi_by_category, tags: [fnb, bill], tagOp: OR, dateRange: A7, valueRange: {fromValue: "500000", fromInclusive: true}}
          result: [1]
        - condition: {attr: amount_chi_by_category, tags: [fnb, bill], tagOp: AND, dateRange: A7, valueRange: {fromValue: "500000", fromInclusive: true}}
          result: []
