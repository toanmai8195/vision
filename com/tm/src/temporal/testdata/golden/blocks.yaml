# Golden: dyadic block (CLAUDE.md §4.2). Dùng chung cho bản port Go / Kotlin (custom range).
# e(2026-09-15) = 20711. Block = [from, to] (bao gồm hai đầu).

epoch_days:
  - {date: 1970-01-01, e: 0}
  - {date: 2026-09-15, e: 20711}

closed_by:
  # (e(ds)+1) % 2^k == 0 → build B(k, e(ds)+1−2^k)
  - ds: 2026-09-15
    blocks:
      - {k: 1, from: 2026-09-14, to: 2026-09-15}
      - {k: 2, from: 2026-09-12, to: 2026-09-15}
      - {k: 3, from: 2026-09-08, to: 2026-09-15}
  - ds: 2026-09-14
    blocks: []

decompose:
  - name: A7
    from: 2026-09-09
    to: 2026-09-15
    blocks:
      - {k: 0, from: 2026-09-09, to: 2026-09-09}
      - {k: 1, from: 2026-09-10, to: 2026-09-11}
      - {k: 2, from: 2026-09-12, to: 2026-09-15}
  - {name: A30, from: 2026-08-17, to: 2026-09-15, count: 4}
  - {name: A90, from: 2026-06-18, to: 2026-09-15, count: 5}
  - {name: A180, from: 2026-03-20, to: 2026-09-15, count: 6}
  - name: A1
    from: 2026-09-15
    to: 2026-09-15
    blocks:
      - {k: 0, from: 2026-09-15, to: 2026-09-15}
