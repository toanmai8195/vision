# Golden: com/tm/docs/data-flow-examples.md §3 (churn_score, MUTEX EVENT) và §4 (REMOVE trong MUTEX EVENT).
# Mỗi row điểm churn = signal ADD tag bucket; không có REMOVE.

cases:
  - name: churn_score_band
    attribute:
      id: 301
      name: churn_score_band
      data_type: MUTEX
      feed_mode: EVENT
      tags: {low: 1, mid: 2, high: 3}
      supported_date_ranges: [A1, A7, A30, ALWAYS_ACTIVE]
    ds: 2026-09-15
    history_start: 2026-08-01
    universe: [1, 2, 3, 4]
    tag_events:
      - {uidx: 4, day: 2026-09-01, add: [high]}
      - {uidx: 2, day: 2026-09-09, add: [low]}
      - {uidx: 1, day: 2026-09-09, add: [high]}
      - {uidx: 1, day: 2026-09-12, add: [mid]}
      - {uidx: 3, day: 2026-09-12, add: [high]}
      - {uidx: 2, ts: "2026-09-15T13:00:00Z", add: [mid]}  # scored_at của U1002 (0.41 → mid)
    expected:
      tag_daily:
        - {ds: 2026-09-01, tag: high, add: [4], del: []}
        - {ds: 2026-09-01, tag: __any__, add: [4]}
        - {ds: 2026-09-09, tag: low, add: [2], del: []}
        - {ds: 2026-09-09, tag: high, add: [1], del: []}
        - {ds: 2026-09-09, tag: __any__, add: [1, 2]}
        - {ds: 2026-09-12, tag: mid, add: [1], del: []}
        - {ds: 2026-09-12, tag: high, add: [3], del: []}
        - {ds: 2026-09-12, tag: __any__, add: [1, 3]}
        - {ds: 2026-09-15, tag: mid, add: [2], del: []}
        - {ds: 2026-09-15, tag: __any__, add: [2]}
      latest:
        - {ds: 2026-09-01, tags: {high: [4]}}
        - {ds: 2026-09-09, tags: {low: [2], high: [1, 4]}}
        - {ds: 2026-09-12, tags: {low: [2], mid: [1], high: [3, 4]}}
        - {ds: 2026-09-15, tags: {mid: [1, 2], high: [3, 4]}}
      seen:  # ⋃ ADD(·,0)
        A1: [2]
        A7: [1, 2, 3]
        A30: [1, 2, 3, 4]
      ranges:
        A1: {mid: [2]}
        A7: {mid: [1, 2], high: [3]}
        A30: {mid: [1, 2], high: [3, 4]}
        ALWAYS_ACTIVE: {mid: [1, 2], high: [3, 4]}
      custom:
        - {from: 2026-09-01, to: 2026-09-10, tags: {low: [2], high: [1, 4]}}
      conditions:
        - condition: {attr: churn_score_band, tags: [mid, high], tagOp: OR, dateRange: A30}
          result: [1, 2, 3, 4]

  # §4: attribute giả định preferred_channel (MUTEX, EVENT). X=1, Y=2, Z=3. Giờ theo ICT.
  - name: preferred_channel
    attribute:
      id: 901
      name: preferred_channel
      data_type: MUTEX
      feed_mode: EVENT
      tags: {a: 1, b: 2}
      supported_date_ranges: [A7]
    ds: 2026-09-15
    history_start: 2026-09-01
    universe: [1, 2, 3]
    tag_events:
      - {uidx: 1, day: 2026-09-10, add: [a]}
      - {uidx: 1, day: 2026-09-12, add: [b]}
      - {uidx: 1, day: 2026-09-13, at: "10:00", remove: [b]}
      - {uidx: 2, day: 2026-09-14, at: "08:00", remove: [a]}
      - {uidx: 2, day: 2026-09-14, at: "09:00", add: [a]}
      - {uidx: 3, day: 2026-09-14, at: "09:00", add: [a]}
      - {uidx: 3, day: 2026-09-14, at: "10:00", remove: [a]}
    expected:
      tag_daily:
        - {ds: 2026-09-10, tag: a, add: [1], del: []}
        - {ds: 2026-09-12, tag: b, add: [1], del: []}
        - {ds: 2026-09-13, tag: b, add: [], del: [1]}
        - {ds: 2026-09-14, tag: a, add: [2, 3], del: [3]}
      ranges:
        A7: {a: [2]}  # X: ADD cuối là b, bị REMOVE → không quay lại a; Y: a; Z: không tag nào
