# Golden P1b: com/tm/docs/data-types.md §5 (aggFunc) và §6 (EXTENDED), as-of 15/09/2026.
# A1 = 15/09 · A7 = 09/09→15/09 · A30 = 17/08→15/09.
# Đổi semantics → sửa doc + file này cùng commit (CLAUDE.md §13.4).

cases:
  # ---------------------------------------------------------------- aggFunc — user Chi (uidx 1)
  - name: chi_count
    attribute:
      id: 1101
      name: txn_count_chi
      data_type: PARTIAL_VALUE
      agg_func: COUNT
      tags:
        once: {id: 1, value_range: {from: 1, to: 1, to_inclusive: true}}
        2_3: {id: 2, value_range: {from: 2, to: 3, to_inclusive: true}}
        gte_4: {id: 3, value_range: {from: 4}}
      supported_date_ranges: [A1, A7, A30]
    ds: 2026-09-15
    history_start: 2026-08-01
    universe: [1]
    value_events: &chi
      - {uidx: 1, day: 2026-09-01, value: "1500000"}
      - {uidx: 1, day: 2026-09-10, value: "300000"}
      - {uidx: 1, day: 2026-09-15, value: "200000"}
      - {uidx: 1, day: 2026-09-15, value: "100000"}
    expected:
      pv_daily:
        - {ds: 2026-09-01, uidx: 1, value: "1"}
        - {ds: 2026-09-10, uidx: 1, value: "1"}
        - {ds: 2026-09-15, uidx: 1, value: "2"}
      pv_range_value:
        A1: [{uidx: 1, value: "2"}]
        A7: [{uidx: 1, value: "3"}]
        A30: [{uidx: 1, value: "4"}]
      ranges:
        A1: {2_3: [1]}
        A7: {2_3: [1]}
        A30: {gte_4: [1]}
      conditions:
        - condition: {attr: txn_count_chi, dateRange: A7, valueRange: {fromValue: "3", fromInclusive: true}}
          result: [1]
        - condition: {attr: txn_count_chi, dateRange: A1, valueRange: {fromValue: "3", fromInclusive: true}}
          result: []

  - name: chi_min
    attribute:
      id: 1102
      name: txn_min_chi
      data_type: PARTIAL_VALUE
      agg_func: MIN
      tags:
        lt_150k: {id: 1, value_range: {to: 150000}}
        gte_150k: {id: 2, value_range: {from: 150000}}
      supported_date_ranges: [A1, A7, A30]
    ds: 2026-09-15
    history_start: 2026-08-01
    universe: [1]
    value_events: *chi
    expected:
      pv_daily:
        - {ds: 2026-09-01, uidx: 1, value: "1500000"}
        - {ds: 2026-09-10, uidx: 1, value: "300000"}
        - {ds: 2026-09-15, uidx: 1, value: "100000"}
      pv_range_value:
        A1: [{uidx: 1, value: "100000"}]
        A7: [{uidx: 1, value: "100000"}]
        A30: [{uidx: 1, value: "100000"}]
      ranges:
        A7: {lt_150k: [1]}
      custom:
        - {from: 2026-09-01, to: 2026-09-09, tags: {gte_150k: [1]}}  # chỉ có 1.5M
      conditions:
        - condition: {attr: txn_min_chi, dateRange: A7, valueRange: {toValue: "150000", toInclusive: false}}
          result: [1]

  - name: chi_max
    attribute:
      id: 1103
      name: txn_max_chi
      data_type: PARTIAL_VALUE
      agg_func: MAX
      tags:
        lt_1m: {id: 1, value_range: {to: 1000000}}
        gte_1m: {id: 2, value_range: {from: 1000000}}
      supported_date_ranges: [A1, A7, A30]
    ds: 2026-09-15
    history_start: 2026-08-01
    universe: [1]
    value_events: *chi
    expected:
      pv_range_value:
        A1: [{uidx: 1, value: "200000"}]
        A7: [{uidx: 1, value: "300000"}]
        A30: [{uidx: 1, value: "1500000"}]
      ranges:
        A7: {lt_1m: [1]}
        A30: {gte_1m: [1]}
      conditions:
        - condition: {attr: txn_max_chi, dateRange: A30, valueRange: {fromValue: "1000000", fromInclusive: true}}
          result: [1]
        - condition: {attr: txn_max_chi, dateRange: A7, valueRange: {fromValue: "1000000", fromInclusive: true}}
          result: []

  - name: chi_by_tag_count
    attribute:
      id: 1104
      name: txn_count_by_category_chi
      data_type: PARTIAL_VALUE_BY_TAG
      agg_func: COUNT
      tags: {fnb: 1, travel: 2, bill: 3}
      supported_date_ranges: [A7, A30]
    ds: 2026-09-15
    history_start: 2026-08-01
    universe: [1]
    value_events:
      - {uidx: 1, day: 2026-09-01, tag: travel, value: "1500000"}
      - {uidx: 1, day: 2026-09-10, tag: fnb, value: "300000"}
      - {uidx: 1, day: 2026-09-15, tag: fnb, value: "200000"}
      - {uidx: 1, day: 2026-09-15, tag: bill, value: "100000"}
    expected:
      pv_range_value:
        A7: [{tag: fnb, uidx: 1, value: "2"}, {tag: bill, uidx: 1, value: "1"}]
      conditions:
        - condition: {attr: txn_count_by_category_chi, tags: [fnb], dateRange: A7, valueRange: {fromValue: "2", fromInclusive: true}}
          result: [1]
        - condition: {attr: txn_count_by_category_chi, tags: [bill], dateRange: A7, valueRange: {fromValue: "2", fromInclusive: true}}
          result: []

  # ---------------------------------------------------------------- EXTENDED
  # Follow Official Account (NOT_MUTEX EVENT, EXTENDED). usage ~ meta.condition_usage ban đầu.
  - name: oa_follow
    attribute:
      id: 1201
      name: oa_follow
      data_type: NOT_MUTEX
      feed_mode: EVENT
      attribute_type: EXTENDED
      supported_date_ranges: [A7, A30]
    ds: 2026-09-15
    history_start: 2026-08-01
    universe: [1, 2, 3]
    tag_events:
      - {uidx: 1, day: 2026-09-02, add: [oa_12345]}
      - {uidx: 2, day: 2026-09-10, add: [oa_12345, oa_777]}
      - {uidx: 1, day: 2026-09-13, remove: [oa_12345]}  # unfollow
      - {uidx: 3, day: 2026-09-14, add: [oa_999]}
    usage:
      A7: [oa_12345]
      A30: [oa_12345, oa_777]
    expected:
      tag_dict: {oa_12345: 1, oa_777: 2, oa_999: 3}  # cấp id theo thứ tự gặp
      scopes:  # range chỉ materialize tag được dùng
        A7: [oa_12345]
        A30: [oa_12345, oa_777]
      ranges:
        A7: {oa_12345: [2]}
        A30: {oa_12345: [2], oa_777: [2]}
      conditions:
        - condition: {attr: oa_follow, tags: [oa_999], dateRange: A7}  # chưa materialize → on-demand
          result: [3]
        - condition: {attr: oa_follow, tags: [oa_12345, oa_777], tagOp: AND, dateRange: A30}
          result: [2]
        - condition: {attr: oa_follow, tags: [oa_never_seen], dateRange: A7}  # chưa có trong tag_dict → rỗng
          result: []
      usage_after:  # on-demand đã ghi usage → ngày sau precompute
        A7: [oa_12345, oa_999]
        A30: [oa_12345, oa_777]

  # Voucher đang giữ (NOT_MUTEX STATE, EXTENDED)
  - name: voucher_holding
    attribute:
      id: 1202
      name: voucher_holding
      data_type: NOT_MUTEX
      feed_mode: STATE
      attribute_type: EXTENDED
      supported_date_ranges: [A7, A30]
    ds: 2026-09-15
    history_start: 2026-08-01
    universe: [1, 2]
    intervals:
      - {uidx: 1, tag: v_abc, from: 2026-09-01}
      - {uidx: 2, tag: v_abc, from: 2026-09-01, to: 2026-09-10}
      - {uidx: 2, tag: v_xyz, from: 2026-09-12}
    usage:
      A7: [v_abc]
    expected:
      scopes:
        A7: [v_abc]
        A30: []
      ranges:
        A7: {v_abc: [1]}
        A30: {}
      conditions:
        - condition: {attr: voucher_holding, tags: [v_xyz], dateRange: A30}
          result: [2]
        - condition: {attr: voucher_holding, tags: [v_abc, v_xyz], tagOp: OR, dateRange: A7}
          result: [1, 2]

  # Giá trị quà theo mã quà (PARTIAL_VALUE_BY_TAG SUM, EXTENDED)
  - name: gift_value
    attribute:
      id: 1203
      name: gift_value
      data_type: PARTIAL_VALUE_BY_TAG
      attribute_type: EXTENDED
      supported_date_ranges: [A7, A30]
    ds: 2026-09-15
    history_start: 2026-08-01
    universe: [1, 2]
    value_events:
      - {uidx: 1, day: 2026-09-10, tag: gift_abc, value: "50000"}
      - {uidx: 1, day: 2026-09-14, tag: gift_abc, value: "70000"}
      - {uidx: 2, day: 2026-09-15, tag: gift_abc, value: "30000"}
      - {uidx: 2, day: 2026-09-15, tag: gift_xyz, value: "200000"}
    usage:
      A7: [gift_abc]
    expected:
      scopes:
        A7: [gift_abc]
        A30: []
      pv_range_value:
        A7: [{tag: gift_abc, uidx: 1, value: "120000"}, {tag: gift_abc, uidx: 2, value: "30000"}]
      conditions:
        - condition: {attr: gift_value, tags: [gift_abc], dateRange: A7, valueRange: {fromValue: "100000", fromInclusive: true}}
          result: [1]
        - condition: {attr: gift_value, tags: [gift_xyz], dateRange: A7, valueRange: {fromValue: "100000", fromInclusive: true}}
          result: [2]
        - condition: {attr: gift_value, tags: [gift_zzz], dateRange: A7, valueRange: {fromValue: "0", fromInclusive: true}}
          result: []
