# Compose local cho vision. Mỗi bước chỉ thêm service nó cần (xem com/tm/docs/phases/step-00-foundation.md):
#   2 Postgres OLTP + oltp-seed (+ oltp-generate, profile bigseed) · 3 Kafka/Debezium/Flink/MinIO/Iceberg REST · 4 Spark
#   5 StarRocks + Postgres meta · 9 Redis · 10 Airflow/Prometheus/Grafana
name: vision

services:
  # Bước 2: Postgres OLTP = nguồn nghiệp vụ (L0). Tách khỏi Postgres `meta` (bước 5).
  # wal_level=logical để Debezium đọc log ở bước 3.
  postgres-oltp:
    image: postgres:16.4
    container_name: vision-postgres-oltp
    environment:
      POSTGRES_USER: vision
      POSTGRES_PASSWORD: vision
      POSTGRES_DB: oltp
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=10", "-c", "max_wal_senders=10"]
    ports:
      - "5433:5432"
    volumes:
      - postgres-oltp-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vision -d oltp"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Bước 2: one-shot, áp schema + nạp data ví dụ golden (chỉ khi chưa có). Chạy xong thoát (Exit 0 là bình thường).
  # Nạp lại: FORCE_SEED=1 docker compose -f <file> up oltp-seed
  oltp-seed:
    image: postgres:16.4
    container_name: vision-oltp-seed
    depends_on:
      postgres-oltp:
        condition: service_healthy
    restart: "no"
    environment:
      PGHOST: postgres-oltp
      PGUSER: vision
      PGPASSWORD: vision
      PGDATABASE: oltp
      FORCE_SEED: ${FORCE_SEED:-0}
    volumes:
      - ../../src/ingest/oltp:/seed:ro
    entrypoint: ["bash", "/seed/init_seed.sh"]

  # Bước 2: sinh thêm data lớn để test, KHÔNG chạy mặc định (profile bigseed). Ví dụ:
  #   GENERATE_ARGS="--users 10000 --days 30" docker compose -f <file> --profile bigseed up oltp-generate
  # Cài psycopg lúc container start (chưa có layer site-packages dựng sẵn, xem TODO(verify) ở CLAUDE.md §8).
  oltp-generate:
    image: python:3.11-slim
    container_name: vision-oltp-generate
    profiles: ["bigseed"]
    depends_on:
      oltp-seed:
        condition: service_completed_successfully
    restart: "no"
    environment:
      VISION_OLTP_DSN: postgresql://vision:vision@postgres-oltp:5432/oltp
      GENERATE_ARGS: ${GENERATE_ARGS:---users 1000 --days 30}
    volumes:
      - ../../src/ingest/oltp:/seed:ro
    entrypoint: ["bash", "-c", "pip install -q --disable-pip-version-check 'psycopg[binary]==3.2.9' && python /seed/generate.py $$GENERATE_ARGS"]

  # ===== Bước 3: ingest OLTP -> bronze (L1) =====

  # Kafka KRaft 1 node. Trong compose dùng kafka:9092; từ host dùng localhost:29092.
  kafka:
    image: apache/kafka:3.8.0
    container_name: vision-kafka
    ports: ["29092:29092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 5s
      timeout: 10s
      retries: 20

  # Debezium = Kafka Connect + connector Postgres. Connector đăng ký ở task CDC (REST :8083).
  debezium:
    image: quay.io/debezium/connect:2.7.3.Final
    container_name: vision-debezium
    depends_on:
      kafka: { condition: service_healthy }
      postgres-oltp: { condition: service_healthy }
    ports: ["8083:8083"]
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: vision-connect
      CONFIG_STORAGE_TOPIC: vision_connect_configs
      OFFSET_STORAGE_TOPIC: vision_connect_offsets
      STATUS_STORAGE_TOPIC: vision_connect_status
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/connectors >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30

  # MinIO = S3 local cho Iceberg (warehouse) và segment sau này. Console: http://localhost:9001 (vision / vision-secret).
  # TODO(verify): MinIO không còn pull được từ registry công khai -> pin theo digest của bản local
  # (RELEASE.2025-09-07T16-13-09Z, arm64). Máy khác chưa có image này sẽ không pull được.
  minio:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: vision-minio
    command: ["server", "/data", "--console-address", ":9001"]
    ports: ["9000:9000", "9001:9001"]
    environment:
      MINIO_ROOT_USER: vision
      MINIO_ROOT_PASSWORD: vision-secret
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot: tạo bucket (idempotent). Cùng lưu ý pin digest như minio.
  minio-init:
    image: minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    container_name: vision-minio-init
    depends_on:
      minio: { condition: service_healthy }
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mc alias set local http://minio:9000 vision vision-secret &&
        mc mb --ignore-existing local/vision-warehouse local/vision-segments

  # Iceberg REST catalog, warehouse s3://vision-warehouse trên MinIO. Metadata catalog lưu SQLite trong volume.
  iceberg-rest:
    image: apache/iceberg-rest-fixture:1.9.2
    container_name: vision-iceberg-rest
    depends_on:
      minio-init: { condition: service_completed_successfully }
    ports: ["8181:8181"]
    environment:
      CATALOG_WAREHOUSE: s3://vision-warehouse/
      CATALOG_URI: jdbc:sqlite:file:/home/iceberg/iceberg_catalog.db?journal_mode=WAL&busy_timeout=30000
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      AWS_ACCESS_KEY_ID: vision
      AWS_SECRET_ACCESS_KEY: vision-secret
      AWS_REGION: us-east-1
    volumes:
      - iceberg-catalog:/home/iceberg
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8181/v1/config >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Flink 1.20 session cluster (UI http://localhost:8081). Image build từ ./flink (có jar Kafka/Iceberg/Hadoop).
  flink-jobmanager:
    build: ./flink
    image: vision/flink:1.20.2-iceberg1.9.2
    container_name: vision-flink-jobmanager
    command: jobmanager
    ports: ["8081:8081"]
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        rest.address: flink-jobmanager
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/overview >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30

  flink-taskmanager:
    build: ./flink
    image: vision/flink:1.20.2-iceberg1.9.2
    container_name: vision-flink-taskmanager
    command: taskmanager
    depends_on:
      flink-jobmanager: { condition: service_healthy }
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4

  # One-shot: tạo sẵn topic CDC (Flink source không chịu topic chưa tồn tại, kể cả khi bảng nguồn còn rỗng).
  kafka-init:
    image: apache/kafka:3.8.0
    container_name: vision-kafka-init
    depends_on:
      kafka: { condition: service_healthy }
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for t in payment_event user_profile user_product voucher_grant oa_follow app_event; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
            --topic vision.src.$$t.v1 --partitions 3 --replication-factor 1
        done

  # One-shot: đăng ký connector Debezium (OLTP -> Kafka), idempotent.
  debezium-register:
    image: quay.io/debezium/connect:2.7.3.Final
    container_name: vision-debezium-register
    depends_on:
      debezium: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
    restart: "no"
    volumes:
      - ../../src/ingest/cdc:/cdc:ro
    entrypoint: ["bash", "/cdc/debezium/register.sh"]

  # One-shot: nộp job Flink SQL bronze_ingest (Kafka -> Iceberg bronze). Bỏ qua nếu job đang chạy.
  flink-sql-submit:
    image: vision/flink:1.20.2-iceberg1.9.2
    container_name: vision-flink-sql-submit
    depends_on:
      flink-jobmanager: { condition: service_healthy }
      flink-taskmanager: { condition: service_started }
      iceberg-rest: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
    restart: "no"
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        rest.address: flink-jobmanager
    volumes:
      - ../../src/ingest/cdc:/cdc:ro
    entrypoint: ["bash", "/cdc/flink/submit.sh"]

volumes:
  postgres-oltp-data:
  kafka-data:
  minio-data:
  iceberg-catalog:
