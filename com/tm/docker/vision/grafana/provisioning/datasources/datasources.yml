apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true

  # Số liệu theo tag / segment (dq.result, seg.build_stats) — không đưa vào Prometheus.
  - name: StarRocks
    uid: starrocks
    type: mysql
    access: proxy
    url: starrocks:9030
    user: root
    jsonData:
      database: dq

  - name: VisionMeta
    uid: vision_meta
    type: grafana-postgresql-datasource
    access: proxy
    url: postgres:5432
    user: vision
    secureJsonData:
      password: vision
    jsonData:
      database: vision_meta
      sslmode: disable
